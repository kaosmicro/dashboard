name: Update Steam Activity

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

jobs:
  update-steam:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Steam updater
        run: node scripts/update-steam.js
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dashboard/steam.json
          git commit -m "Update Steam activity" || exit 0
          git push
